name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-gates:
    name: artifact-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/*.sh
          /usr/bin/python3 -m py_compile scripts/*.py
          ./scripts/check_profiles.py
          ./scripts/check_ros2_semantics_contract.py
          ./scripts/check_native_production_preset.py
          ./scripts/check_cocolic_port_results.py --require-evidence-hashes
          ./scripts/check_strict_parity_matrix.py
          ./scripts/check_paper_completion.py --allow-incomplete

      - name: Artifact comparison gates
        shell: bash
        run: |
          set -euo pipefail
          export GAUSSIAN_LIC_ARTIFACT_DIR=artifact_reports
          ./scripts/verify_artifact_gates.sh
          cat artifact_reports/baseline_readiness.md >> "${GITHUB_STEP_SUMMARY}"
          cat artifact_reports/reproduction_report.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload artifact gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-gate-reports
          path: artifact_reports
          if-no-files-found: error

  build:
    name: build-${{ matrix.ros_distro }}
    runs-on: ubuntu-latest
    container: ros:${{ matrix.ros_distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [jazzy]
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libceres-dev \
            libeigen3-dev \
            libgoogle-glog-dev \
            liblz4-dev \
            libopencv-dev \
            libpcl-dev \
            libyaml-cpp-dev \
            python3-colcon-common-extensions \
            python3-pytest \
            python3-yaml \
            ripgrep \
            ros-${ROS_DISTRO}-cv-bridge \
            ros-${ROS_DISTRO}-pcl-conversions \
            ros-${ROS_DISTRO}-rclcpp-components \
            ros-${ROS_DISTRO}-ros2bag \
            ros-${ROS_DISTRO}-rosbag2-py \
            ros-${ROS_DISTRO}-rosbag2-storage-mcap \
            ros-${ROS_DISTRO}-rosbag2-transport \
            ros-${ROS_DISTRO}-sensor-msgs-py \
            ros-${ROS_DISTRO}-tf2-ros

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source /opt/ros/${ROS_DISTRO}/setup.bash
          set -u
          bash -n scripts/*.sh
          /usr/bin/python3 -m py_compile \
            scripts/*.py \
            src/gaussian_lic_bringup/launch/run_bag.launch.py \
            src/gaussian_lic_frontend/scripts/livox_custom_to_pointcloud2.py \
            src/gaussian_lic_tools/gaussian_lic_tools/*.py
          /usr/bin/python3 src/gaussian_lic_frontend/scripts/livox_custom_to_pointcloud2.py --self-test
          (cd src/gaussian_lic_bringup && /usr/bin/python3 -m pytest -q test)
          (cd src/gaussian_lic_tools && /usr/bin/python3 -m pytest -q test)
          ./scripts/check_profiles.py
          ./scripts/check_ros2_semantics_contract.py
          ./scripts/check_native_production_preset.py
          ./scripts/check_cocolic_port_results.py --require-evidence-hashes
          ./scripts/check_strict_parity_matrix.py
          ./scripts/check_paper_completion.py --allow-incomplete

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source /opt/ros/${ROS_DISTRO}/setup.bash
          set -u
          ./scripts/build_ros2.sh --cpu-only --event-handlers console_direct+

      - name: Workspace tests
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source /opt/ros/${ROS_DISTRO}/setup.bash
          set -u
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

      - name: Jazzy synthetic replay smoke
        if: matrix.ros_distro == 'jazzy'
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          set -u
          ./scripts/ci_replay_smoke.sh \
            --bag bags/ci_synthetic_gs_demo \
            --artifact-dir ci_replay_artifacts \
            --duration 4 \
            --timeout 20
          cat ci_replay_artifacts/replay_summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Jazzy replay artifacts
        if: always() && matrix.ros_distro == 'jazzy'
        uses: actions/upload-artifact@v4
        with:
          name: jazzy-replay-artifacts
          path: ci_replay_artifacts
          if-no-files-found: ignore

      - name: Upload build and smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ros_distro }}-ci-logs
          path: log
          if-no-files-found: ignore
