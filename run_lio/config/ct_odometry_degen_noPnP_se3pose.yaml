odometry_mode: 1  # LICO = 1 (full LiDAR-Inertial-Camera, slimmed R3LIVE front-end)

project_path: /home/frank/gaussian_lic_ros2/run_lio

lidar_yaml: /fastlivo/lidar.yaml
imu_yaml: /fastlivo/imu.yaml
camera_yaml: /fastlivo/camera.yaml

bag_path: /home/frank/data/fast_livo/LiDAR_Degenerate_frontend_raw_fixed
bag_start: 0.
bag_durr: -1


### SplineParams ###
t_add: 0.1
distance0: 0.03
non_uniform: true
division_coarse: 1


### OptimizationParams ###
t_begin_add_cam: 5.0   # add visual constraints after 5s of successful init
lidar_iter: 2
use_lidar_scale: true
lidar_weight: 500.0
image_weight: 0.0
gyroscope_noise_density: 3.45557556e-03
gyroscope_random_walk: 2.617993833e-07
accelerometer_noise_density: 2.425376259e-02
accelerometer_random_walk: 1.96e-06


### EvalutaionParams ###
is_evo_viral: false


### Gaussian-LIC ###
if_3dgs: true  # no 3DGS back-end (odometry only)
lidar_skip: 10

# 在线闭环 + Render-SE3(论文 Option 2 位姿级)
gs_live_publish: true
gs_lockstep: true
gs_lockstep_max_lag_s: 0.5
gs_lockstep_timeout_s: 2.0
enable_render_photometric: false
enable_render_se3_pose: true
render_se3_pos_weight: 20.0
render_se3_rot_weight: 20.0
render_se3_iterations: 6
render_se3_min_samples: 150
render_se3_stride: 4
render_se3_max_step_m: 0.5
render_se3_max_lag_s: 1.0
render_se3_huber: 12.0
